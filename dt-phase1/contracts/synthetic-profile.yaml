  - z3
  - z4
  - z5
  - z6
  - z7
  - z8
  - z1
  - z9
  - z10
  - z11
  - amr
  - energy
assets:
  - zone: z2
    asset_id: smt-l1-reflow
    update_frequency_s: 2
    metrics:
      - zone1_temp_c
      - zone7_temp_c
      - conveyor_speed_mm_min
      - machine_state
      - alarm_active
  - zone: z3
    asset_id: smt-l2-reflow
    update_frequency_s: 2
    metrics:
      - zone1_temp_c
      - zone7_temp_c
      - conveyor_speed_mm_min
      - machine_state
      - alarm_active
  - zone: z4
    asset_id: ph-torque
    instances: ["01", "02", "03", "04"]
    update_frequency_s: 2
    metrics:
      - torque_nm
      - result_ok_nok
      - machine_state
  - zone: z4
    asset_id: ph-flash
    instances: ["01", "02", "03", "04", "05", "06"]
