    asset_id: bess-01
    update_frequency_s: 5
    metrics:
      - soc_pct
      - soh_pct
      - charge_discharge_kw
  - zone: energy
    asset_id: bess-02
    update_frequency_s: 5
    metrics:
      - soc_pct
      - soh_pct
      - charge_discharge_kw
